# Minimal kitty config for lcarcat visual testing.
# Includes the live LCARS theme so screenshots reflect real-world rendering.
include ~/.config/kitty/lcars.conf

enabled_layouts         splits
shell                   /bin/zsh
font_family             Fantasque Sans Mono Regular
italic_font             Fantasque Sans Mono Italic
font_size               18.0
initial_window_width    900
initial_window_height   650
confirm_os_window_close 0
allow_remote_control    yes
