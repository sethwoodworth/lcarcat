# kitty config for the rich README demo. Wider window for a 3-pane layout.
# Same LCARS theme as kitty_test.conf; larger canvas for better screenshots.
include ~/.config/kitty/lcars.conf

enabled_layouts         splits
shell                   /bin/zsh
font_family             Fantasque Sans Mono Regular
italic_font             Fantasque Sans Mono Italic
font_size               18.0
initial_window_width    1600
initial_window_height   900
confirm_os_window_close 0
allow_remote_control    yes
tab_bar_min_tabs        1
tab_bar_style           powerline
tab_bar_edge            top
