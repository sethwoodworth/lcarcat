# lcarcat keybindings — included from kitty.conf.
# See kitty/keybindings.snippet.conf for the older append-style snippet.

# Prompt navigation (OSC 133 marks from shell integration)
map ctrl+a>[ scroll_to_prompt -1
map ctrl+a>] scroll_to_prompt 1
map ctrl+a>g show_last_command_output

# nvim command buffer mode — splits a 4-line nvim scratch buffer below the current pane
map ctrl+a>b launch --location=hsplit --bias=6 --cwd=current --env LCARCAT_COMMAND_BUFFER=1 nvim -c "set buftype=nofile bufhidden=hide noswapfile showtabline=0" -c "lua require('lcars.command_buffer')" -c "startinsert"
