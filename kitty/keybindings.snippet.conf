# lcarcat — scrollback prompt navigation (append to your kitty.conf / keybindings.conf).
# Rides on the OSC 133 marks kitty's shell integration already emits.
map ctrl+a>[ scroll_to_prompt -1
map ctrl+a>] scroll_to_prompt 1
map ctrl+a>g show_last_command_output

# nvim command buffer mode — splits a 4-line nvim scratch buffer below the current pane
map ctrl+a>b launch --location=hsplit --bias=20 --cwd=current nvim -c "set buftype=nofile bufhidden=hide noswapfile" -c "startinsert"
