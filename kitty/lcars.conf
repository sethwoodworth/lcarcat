# LCARS theme for kitty — colors + tab-bar/border chrome.
# Switchable: this file is `include`d from kitty.conf. Comment that include
# (and reload with ctrl+a>f) to fall back to the light papercolor theme.
#
# Palette values are the finalized LCARS 16-color set (oomox-derived, tweaked):
#   green slot -> sage (#88bb88/#99cc99) so diffs/ls read as green
#   cyan slot  -> #99ccff, br-cyan -> #cceeff
#   br-red     -> hot #ff3300
#   #ff9900 (atomic tangerine) lives here in the chrome, not the ANSI table.

# --- Core colors ---
background            #000000
foreground            #ffffc6
cursor                #cc6699
cursor_text_color     #000000
selection_background  #9999ff
selection_foreground  #000000

# --- 16-color ANSI palette ---
# normal
color0  #000000
color1  #cc6666
color2  #88bb88
color3  #cc9966
color4  #9966ff
color5  #cc6699
color6  #99ccff
color7  #ffcc99
# bright
color8  #666699
color9  #ff3300
color10 #99cc99
color11 #ffcc66
color12 #9999ff
color13 #cc99cc
color14 #cceeff
color15 #ccccff

# --- Window borders ---
active_border_color   #ff9900
inactive_border_color #9999cc
bell_border_color     #cc6666

# --- Tab bar: black strip, orange active pill, periwinkle inactive pills ---
#  /  are the rounded (half-circle) powerline caps -> LCARS pills.
# Tab backgrounds are BLACK (same as the strip) so the cap glyphs render on
# black; the pill body/color is painted entirely by the templates below.
# (If a tab bg were the pill color, the left cap would sit on that color and
# its rounded notch would fill in -> square corner.)
tab_bar_background        #000000
active_tab_foreground     #000000
active_tab_background     #000000
active_tab_font_style     bold
inactive_tab_foreground   #000000
inactive_tab_background   #000000
inactive_tab_font_style   normal

active_tab_title_template " {fmt.fg._ff9900}{fmt.bg._ff9900}{fmt.fg._000000}{index}|{title}{fmt.bg.default}{fmt.fg._ff9900}{fmt.fg.default} "
tab_title_template        " {fmt.fg._9999ff}{fmt.bg._9999ff}{fmt.fg._000000}{index}|{title}{fmt.bg.default}{fmt.fg._9999ff}{fmt.fg.default} "
